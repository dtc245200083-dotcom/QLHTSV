services:
  db:
    image: mysql:8.0
    container_name: qlhtsv_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: qlhtsv
      MYSQL_USER: qlhtsv_user
      MYSQL_PASSWORD: qlhtsv_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: qlhtsv_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: qlhtsv
      DB_USER: qlhtsv_user
      DB_PASSWORD: qlhtsv_password
    depends_on:
      - db
    networks:
      - backend
      - frontend

  nginx:
    image: nginx:alpine
    container_name: qlhtsv_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - frontend

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: qlhtsv_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - backend
      - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: qlhtsv_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - frontend

  grafana:
    image: grafana/grafana:latest
    container_name: qlhtsv_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - frontend

  loki:
    image: grafana/loki:latest
    container_name: qlhtsv_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - frontend

  promtail:
    image: grafana/promtail:latest
    container_name: qlhtsv_promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:

volumes:
  mysql_data:
